name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "daily_report/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 환경"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

env:
  PROJECT_ID: daily-report-495008
  REGION: asia-northeast3
  SERVICE_NAME: daily-report
  REGISTRY: asia-northeast3-docker.pkg.dev/daily-report-495008/daily-report/app

defaults:
  run:
    working-directory: daily_report

jobs:
  ci:
    name: CI (Lint + Test)
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation 필요

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}:latest \
            -f Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'
